name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # The floor the library targets, and the current LTS it is most often run on.
        java: ['17', '21']
        # The starter compiles against the Spring Boot 3 the pom names and runs
        # on Boot 4 unchanged, so one leg each: the pom's own versions, and Boot
        # 4 with the Spring Framework it pins.
        boot: ['pom', '4']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven
      - run: mvn -B verify ${{ matrix.boot == '4' && '-Dspring.boot.version=4.1.1 -Dspring.version=7.0.9' || '' }}
